<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Remates de Herramientas en México</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #0d0f12;
      color: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    .card {
      background: #16191f;
      border: 1px solid #282d37;
      border-radius: 14px;
      max-width: 440px;
      width: 100%;
      padding: 24px 20px;
      box-shadow: 0 12px 36px rgba(0,0,0,0.5);
      text-align: left;
    }
    .badge {
      display: inline-block;
      background: #ffd600;
      color: #000;
      font-weight: 800;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      padding: 4px 8px;
      border-radius: 4px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 22px;
      line-height: 1.35;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 14px;
    }
    p.lead {
      font-size: 15px;
      line-height: 1.5;
      color: #b0b8c4;
      margin-bottom: 20px;
    }
    .highlight {
      color: #00e5ff;
      font-weight: 600;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #25d366;
      color: #000;
      text-decoration: none;
      font-size: 17px;
      font-weight: 800;
      padding: 16px 20px;
      border-radius: 10px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 18px rgba(37, 211, 102, 0.35);
      transition: transform 0.1s ease;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .telegram-icon {
      width: 22px;
      height: 22px;
      fill: #000;
    }
    .footer-note {
      text-align: center;
      margin-top: 14px;
      font-size: 12px;
      color: #6b7787;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="badge">Aviso de Ocasión • México</div>
    <h1 id="headline">Cargando...</h1>
    <p class="lead" id="body-text"></p>

    <a href="https://t.me/ofertas_herramientas_mx" class="btn" id="cta-btn">
      <svg class="telegram-icon" viewBox="0 0 24 24">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69.01-.03.01-.14-.07-.19-.08-.05-.19-.02-.27 0-.12.03-1.99 1.27-5.61 3.72-.53.36-1.01.54-1.44.53-.47-.01-1.38-.27-2.05-.49-.83-.27-1.49-.42-1.43-.88.03-.24.37-.49 1.02-.75 4-.1.74 6.7 1.74 8.76 2.62 4.14 1.76 5 2.06 5.56 2.07.12 0 .4-.03.58-.19.15-.13.19-.31.21-.49.02-.21.03-.43.01-.65z"/>
      </svg>
      <span id="btn-text">VER REMATES EN TELEGRAM</span>
    </a>

    <p class="footer-note">
      Canal público y gratuito. Solo 4 ofertas al día.<br>Descuentos reales verificados en Mercado Libre México.
    </p>
  </div>

  <script>
    const variants = [
      {
        tag: "v1_cuchillo",
        headline: "Si te vas a quedar a ver la película, por lo menos deja de usar un cuchillo como desarmador.",
        lead: "Apretar una pija toma 30 segundos. El técnico te cobra <span class='highlight'>$600 pesos</span> porque en tu casa no hay ni unas pinzas de presión. En este canal rastreamos herramientas en Mercado Libre México cuando caen a precio de liquidación.",
        cta: "VER HERRAMIENTAS EN REMATE"
      },
      {
        tag: "v2_plomero",
        headline: "Un empaque cuesta $15 pesos. El plomero te cobró $800.",
        lead: "No te cobró por el trabajo. Te cobró porque <span class='highlight'>él sí traía la llave Stilson</span> y tú estabas improvisando con unas pinzas oxidadas. Rastreamos remates reales de herramientas de trabajo para que armes tu caja sin pagar sobreprecio.",
        cta: "UNIRME AL CANAL DE TELEGRAM"
      },
      {
        tag: "v3_vecino",
        headline: "Tu vecino no te quiere prestar su taladro.",
        lead: "Te dice que sí por educación, pero cada que le tocas la puerta piensa que eres un conchudo. Cómprate tus propias herramientas cuando caigan en <span class='highlight'>descuento real del 30% al 50%</span> en Mercado Libre.",
        cta: "ENTRAR AL CANAL GRATIS"
      }
    ];

    // Rotación aleatoria equitativa (33.3% cada una)
    const pick = variants[Math.floor(Math.random() * variants.length)];

    document.getElementById("headline").innerText = pick.headline;
    document.getElementById("body-text").innerHTML = pick.lead;
    document.getElementById("btn-text").innerText = pick.cta;

    // Ajustar link con parámetro de tracking
    const baseLink = "https://t.me/ofertas_herramientas_mx";
    document.getElementById("cta-btn").href = baseLink;
  </script>
</body>
</html>
